<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild War Log — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13151a; --bg-panel:#1a1d24; --bg-panel-2:#15171d; --bg-elevated:#20232c;
  --ink:#eceef2; --ink-soft:#8b93a1; --ink-faint:#575e6b;
  --cyan:#5b8def; --cyan-dim:#4a78c9; --magenta:#e5535c; --green:#3ecf8e; --gold:#dc9a3d;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13); --shadow:rgba(0,0,0,.28);
}
*{box-sizing:border-box;}
body{margin:0;}
html,body{
  background:var(--bg);
  color:var(--ink); font-family:'Inter',sans-serif; font-weight:400; font-size:15.5px; line-height:1.55; min-height:100vh;
}
a{color:var(--cyan);}
.wrap{ max-width:1900px; width:94%; margin:0 auto; padding:32px 0 70px; }
.masthead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:16px; margin-bottom:8px; border-bottom:1px solid var(--line-strong); flex-wrap:wrap; }
.masthead h1{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:-.01em; font-size:clamp(19px,2vw,26px); margin:0; }
.masthead-title-input{
  font-family:'Inter',sans-serif; font-weight:700; letter-spacing:-.01em;
  font-size:clamp(19px,2vw,26px); color:var(--ink); background:transparent; border:none; padding:2px 0;
  border-bottom:1px dashed transparent; width:auto; max-width:70vw;
}
.masthead-title-input:hover, .masthead-title-input:focus{ border-bottom:1px dashed var(--cyan); outline:none; box-shadow:none; }
.masthead .sub{ font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
label{ font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:600; }
input[type=text], input[type=date], input[type=email], input[type=number], select, textarea{
  font-family:'Inter',sans-serif; font-weight:500; font-size:14.5px; color:var(--ink); background:var(--bg-panel-2);
  border:1px solid var(--line); border-radius:7px; padding:9px 12px; width:100%;
}
input:focus, select:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(91,141,239,.18); }
.field-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.field-row > div{ flex:1 1 160px; }
.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px; letter-spacing:0; cursor:pointer;
  padding:9px 17px; border:1px solid var(--cyan); background:transparent; color:var(--cyan);
  border-radius:7px; transition:background .12s, border-color .12s;
}
.btn:hover{ background:rgba(91,141,239,.12); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.gold{ border-color:var(--gold); color:var(--gold); }
.btn.gold:hover{ background:rgba(220,154,61,.12); }
.btn.ghost{ border-color:var(--line-strong); color:var(--ink-soft); }
.btn.ghost:hover{ color:var(--ink); background:rgba(255,255,255,.04); }
.btn.danger{ border-color:var(--magenta); color:var(--magenta); }
.btn.danger:hover{ background:rgba(229,83,92,.12); }
.btn.small{ padding:6px 12px; font-size:12px; }
.hud-panel{ position:relative; background:var(--bg-panel); border:1px solid var(--line-strong); border-radius:12px; padding:30px 32px; box-shadow:0 4px 20px var(--shadow); margin-top:20px; }
.corner{ display:none; }
.section-title{ font-family:'Inter',sans-serif; font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0 0 8px; }
.section-hint{ font-size:15.5px; color:var(--ink-soft); margin:0 0 18px; max-width:70ch; line-height:1.6; }
.status-line{ font-size:13.5px; margin-top:10px; color:var(--ink-soft); min-height:18px; }
.status-line.error{ color:var(--magenta); }
.status-line.ok{ color:var(--green); }
.empty-state{ padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:14.5px; }
.job-icon{ width:20px; height:20px; flex:0 0 auto; display:inline-block; vertical-align:middle; }
.hidden{ display:none !important; }
.chip{ display:inline-flex; align-items:center; gap:7px; background:var(--bg-panel-2); border:1px solid var(--line-strong); border-radius:20px; padding:7px 14px; margin:4px 5px 4px 0; font-size:14px; font-family:'Inter',sans-serif; font-weight:500; }
.chip button{ background:none; border:none; color:var(--magenta); cursor:pointer; font-size:13px; padding:0; }
/* team / party editing */
.team-name-input{ font-family:'Inter',sans-serif; font-weight:700; font-size:19px; letter-spacing:-.005em; background:transparent; border:none; color:var(--cyan); max-width:280px; padding:2px 0; border-bottom:1px dashed transparent; }
.team-name-input:focus,.team-name-input:hover{ border-bottom:1px dashed var(--cyan); outline:none; }
.team-header{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--line-strong); }
.team-block{ margin-bottom:32px; }
.party-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:20px; margin-bottom:10px; }
@media (max-width:1000px){ .party-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:520px){ .party-grid{ grid-template-columns:1fr; } }
.party-card{ border:1px solid var(--line); background:var(--bg-panel-2); border-radius:9px; padding:16px; }
.party-card-head{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15px; color:var(--cyan-dim); margin-bottom:10px; }
.party-name-input{ background:transparent; border:none; color:var(--cyan-dim); font-weight:700; font-size:15px; padding:2px 0; flex:1 1 auto; border-bottom:1px dashed transparent; }
.party-name-input:hover,.party-name-input:focus{ border-bottom:1px dashed var(--cyan-dim); outline:none; }
.slot-btn{
  font-weight:500; font-size:16px; color:var(--ink); background:var(--bg-panel); border:1px solid var(--line);
  border-radius:7px; padding:11px 12px; width:100%; margin-bottom:9px; text-align:left; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:8px; transition:border-color .12s;
}
.slot-btn:hover{ border-color:var(--line-strong); }
.slot-btn.readonly{ cursor:default; }
.slot-btn.readonly:hover{ border-color:var(--line); }
.slot-btn-label{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:7px; overflow:hidden; }
.slot-label-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slot-btn .job-icon{ width:20px; height:20px; }
.dup-slot{ border-color:var(--magenta) !important; }
/* assignment popover */
.assign-popover{ position:fixed; inset:0; background:rgba(4,6,10,.6); z-index:60; display:flex; align-items:center; justify-content:center; }
.assign-popover.hidden{ display:none; }
.assign-card{ width:300px; max-height:400px; display:flex; flex-direction:column; background:var(--bg-elevated); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.4); }
.assign-header{ padding:10px; border-bottom:1px solid var(--line-strong); display:flex; flex-direction:column; gap:8px; }
.assign-options{ overflow-y:auto; flex:1 1 auto; }
.assign-option{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; font-family:'Inter',sans-serif; font-size:13.5px; border-bottom:1px solid var(--line); }
.assign-option:hover{ background:rgba(45,226,255,.08); }
.assign-option.is-selected{ background:rgba(45,226,255,.14); color:var(--cyan); }
.assign-option-job{ color:var(--ink-soft); font-size:11.5px; display:inline-flex; align-items:center; gap:5px; }
/* lineup list */
.lineup-card{ border:1px solid var(--line); background:rgba(255,255,255,.015); border-radius:9px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.lineup-title{ font-weight:700; font-size:15px; }
.lineup-title a{ color:var(--ink); text-decoration:none; cursor:pointer; }
.lineup-title a:hover{ color:var(--cyan); }
.lineup-meta{ font-size:12.5px; color:var(--ink-soft); font-family:'Inter',sans-serif; margin-top:2px; }
.tabs{ display:flex; gap:6px; margin:20px 0 4px; flex-wrap:wrap; }
.tab-btn{ font-weight:600; font-size:14px; letter-spacing:0; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:7px; padding:9px 18px; cursor:pointer; color:var(--ink-soft); transition:background .12s, color .12s; }
.tab-btn.active{ color:#fff; background:var(--cyan); border-color:var(--cyan); }
/* overview dashboard */
.stat-card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
.stat-card{ position:relative; border:1px solid var(--line-strong); background:var(--bg-panel-2); border-radius:9px; padding:14px 16px; overflow:hidden; }
.stat-card::before{ content:""; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--cyan); }
.stat-card .stat-value{ font-family:'Inter',sans-serif; font-size:23px; font-weight:700; line-height:1.15; }
.stat-card .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-top:5px; font-weight:600; }
.dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px; }
.dash-panel{ border:1px solid var(--line); background:rgba(255,255,255,.015); border-radius:9px; padding:16px; }
.dash-panel h3{ font-family:'Inter',sans-serif; font-size:12px; margin:0 0 12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.lb-row{ display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.lb-row:last-child{ border-bottom:none; }
.lb-rank{ font-family:'Inter',sans-serif; color:var(--ink-faint); font-size:11.5px; width:14px; flex:0 0 auto; }
.lb-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.lb-value{ font-family:'Inter',sans-serif; font-weight:600; color:var(--cyan); flex:0 0 auto; }
.recent-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.recent-row:last-child{ border-bottom:none; }
.recent-row:hover{ background:rgba(45,226,255,.05); }
.recent-row-title{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.recent-row-meta{ font-size:11px; color:var(--ink-soft); font-family:'Inter',sans-serif; margin-top:2px; }
.outcome-tag{ font-weight:700; font-size:10px; letter-spacing:.03em; padding:2px 8px; border:1px solid; border-radius:4px; flex:0 0 auto; }
.job-bar-row{ display:flex; align-items:center; gap:9px; padding:5px 0; font-size:12.5px; }
.job-bar-track{ flex:1 1 auto; height:6px; background:var(--bg-panel); position:relative; min-width:30px; }
.job-bar-fill{ position:absolute; top:0; left:0; bottom:0; }
.job-bar-count{ font-family:'Inter',sans-serif; color:var(--ink-soft); width:18px; text-align:right; flex:0 0 auto; }
.attn-low{ color:var(--magenta); }
.attn-mid{ color:var(--gold); }
.attn-high{ color:var(--green); }
/* session log */
.session-card{ border:1px solid var(--line); background:rgba(255,255,255,.015); border-radius:9px; overflow:hidden; margin-bottom:10px; }
.session-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; cursor:pointer; gap:10px; flex-wrap:wrap; }
.session-head:hover{ background:rgba(45,226,255,.05); }
.session-title{ font-weight:700; font-size:14.5px; }
.session-meta{ font-size:12px; color:var(--ink-soft); font-family:'Inter',sans-serif; margin-top:2px; }
.session-body{ padding:0 16px 16px; display:none; border-top:1px solid var(--line); }
.session-body.open{ display:block; }
.role-badge{ font-weight:700; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; padding:2px 8px; border-radius:4px; border:1px solid; }
.role-badge.role-elite{ color:var(--cyan); border-color:var(--cyan); }
.role-badge.role-sub{ color:var(--gold); border-color:var(--gold); }
.mvp-seal{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; background:var(--gold); color:#1a1206; border-radius:50%; font-size:9px; font-weight:700; margin-right:5px; }
table{ width:100%; border-collapse:collapse; margin-top:12px; }
thead th{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; text-align:left; color:var(--ink-soft); border-bottom:1px solid var(--line-strong); padding:7px 6px; white-space:nowrap; }
tbody td{ padding:7px 6px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; }
tbody tr:hover{ background:rgba(45,226,255,.04); }
td.num, th.num{ text-align:right; }
.sortable{ cursor:pointer; user-select:none; }
.sortable:hover{ color:var(--ink); }
.sort-arrow{ font-size:9px; margin-left:2px; }
.job-cell{ display:flex; align-items:center; gap:7px; }
.job-cell select{ margin-bottom:0; }
td input, td select{ padding:5px 6px; font-size:12.5px; margin-bottom:0; }
.row-del{ background:none; border:none; color:var(--magenta); cursor:pointer; font-size:14px; padding:2px 6px; }
.fr-check, #fr-select-all{ width:16px; height:16px; accent-color:var(--cyan); cursor:pointer; }
.roster-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:4px; }
.roster-card{ position:relative; border:1px solid var(--line); background:var(--bg-panel-2); border-radius:9px; padding:14px 14px 12px; transition:border-color .15s; }
.roster-card:hover{ border-color:var(--line-strong); }
.roster-card.is-selected{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset; }
.roster-card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.roster-mmid-input{ width:100% !important; font-family:'Inter',sans-serif; font-size:12px !important; font-weight:600; font-variant-numeric:tabular-nums; background:transparent !important; border:none !important; border-bottom:1px dashed transparent; color:var(--ink-soft); padding:2px 0 !important; }
tbody tr.is-selected{ background:rgba(45,226,255,.08); }
.roster-mmid-input:hover, .roster-mmid-input:focus{ border-bottom-color:var(--cyan-dim); outline:none; color:var(--ink); }
.roster-name-input{ width:100% !important; font-family:'Inter',sans-serif; font-weight:700; font-size:15px !important; background:transparent !important; border:none !important; color:var(--ink); padding:2px 0 !important; border-bottom:1px solid transparent; margin-bottom:0; }
.roster-name-input:hover, .roster-name-input:focus{ border-bottom-color:var(--cyan); outline:none; }
.roster-job-select{ width:auto !important; background:transparent !important; border:none !important; padding:2px 0 !important; font-family:'Inter',sans-serif; font-weight:500; font-size:14px !important; color:var(--ink); }
.roster-job-select:hover, .roster-job-select:focus{ outline:none; color:var(--cyan); }
.roster-job-row{ display:flex; align-items:center; gap:8px; }
.roster-job-row select{ margin-bottom:0; }
.roster-toolbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin:16px 0 12px; }
.roster-select-all{ display:flex; align-items:center; gap:8px; cursor:pointer; margin:0; font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.roster-sort{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.roster-sort span{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
.roster-sort .btn.active{ color:var(--cyan); border-color:var(--cyan); }
@media (max-width:800px){
  table.responsive thead{ display:none; }
  table.responsive, table.responsive tbody, table.responsive tr, table.responsive td{ display:block; width:100%; }
  table.responsive tr{ border:1px solid var(--line); margin-bottom:8px; padding:6px 8px; }
  table.responsive td{ display:flex; justify-content:space-between; align-items:center; border-bottom:none; padding:5px 2px; gap:8px; }
  table.responsive td::before{ content:attr(data-label); font-size:10px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; flex:0 0 auto; }
  table.responsive td.num{ text-align:right; }
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <input type="text" id="guild-name-input" class="masthead-title-input" value="MADMONKEYS" title="Click to rename your guild — updates everywhere, including guildmates' share links">
      <div class="sub" id="masthead-sub">Officer Dashboard</div>
    </div>
    <button class="btn ghost small hidden" id="signout-btn">Sign Out</button>
  </header>

  <!-- ============ LOGIN ============ -->
  <div id="login-section" class="hud-panel hidden" style="max-width:420px;">
    <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
    <span class="corner corner-bl"></span><span class="corner corner-br"></span>
    <h2 class="section-title">Sign In</h2>
    <p class="section-hint">Officer sign-in.</p>
    <div class="field-row">
      <div>
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Username" autocomplete="username">
      </div>
      <div>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>
    <button class="btn gold" id="login-btn">Sign In</button>
    <div class="status-line" id="login-status"></div>
  </div>

  <!-- ============ APP (signed in) ============ -->
  <div id="app-section" class="hidden">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="new">New Record</button>
      <button class="tab-btn" data-tab="log">Session Log</button>
      <button class="tab-btn" data-tab="fullroster">Full Roster</button>
      <button class="tab-btn" data-tab="attendance">Attendance</button>
      <button class="tab-btn" data-tab="parties">Party List</button>
    </nav>

    <div id="overview-tab" class="hud-panel">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="overview-content"></div>
    </div>

    <div id="new-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="new-content"></div>
    </div>

    <div id="log-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="log-content"></div>
    </div>

    <div id="fullroster-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="fullroster-content"></div>
    </div>

    <div id="attendance-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="attendance-content"></div>
    </div>

    <!-- Party lineups list -->
    <div id="parties-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <h2 class="section-title">Party List</h2>
      <p class="section-hint">Each lineup gets its own public, view-only link — send it to guildmates, they can look but not touch.</p>
      <button class="btn gold" id="new-lineup-btn" style="margin-bottom:18px;">+ New Lineup</button>
      <div id="lineups-list"></div>
    </div>

    <!-- Lineup editor -->
    <div id="editor-tab" class="hud-panel hidden">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div id="editor-content"></div>
    </div>
  </div>

  <div class="status-line" id="global-status" style="margin-top:16px;"></div>
</div>

<div class="assign-popover hidden" id="assign-popover">
  <div class="assign-card">
    <div class="assign-header">
      <input type="text" id="assign-search" placeholder="Search name…">
      <select id="assign-job-filter"><option value="">All Jobs</option></select>
    </div>
    <div class="assign-options" id="assign-options"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — fill these in from Supabase → Project Settings → API
   ========================================================= */
const SUPABASE_URL = 'https://ydftjgrxhrbjmzzwstnr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1Uy0YLjaqqSgk52hS3Lm4Q_0zaxPv4x';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========================= Job data ========================= */
const JOB_OPTIONS = ['High Priest','High Wizard','Paladin','Lord Knight','Mastersmith','Summoner','Sniper','Assasin Cross','Stalker','Biochemist','Rebellion','Gypsy','Minstrel','Professor','Asura'];

function jobIconSvg(job){
  if(!job) return '';
  const inner = JOB_ICONS[job];
  const color = JOB_COLORS[job] || '#7c8998';
  if(!inner){
    // Fallback for jobs outside the standard icon set (e.g. 3rd-class names
    // like "Sorcerer") so something always renders instead of nothing.
    return `<svg class="job-icon" style="color:${color}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/></svg>`;
  }
  return `<svg class="job-icon" style="color:${color}" viewBox="0 0 24 24" fill="currentColor" stroke="none">${inner}</svg>`;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ========================= Boot ========================= */
async function boot(){
  const { data: guild } = await sb.from('guild_settings').select('id,name').limit(1).single();
  if(!guild){ setStatus('No guild_settings row found — did you run schema.sql?', 'error'); return; }
  guildId = guild.id;
  $('guild-name-input').value = guild.name || 'Your Guild';
  $('masthead-sub').textContent = 'Officer Dashboard';
  $('guild-name-input').addEventListener('change', async (e)=>{
    const newName = e.target.value.trim() || 'Your Guild';
    e.target.value = newName;
    await sb.from('guild_settings').update({ name: newName }).eq('id', guildId);
    setStatus('Guild name updated.', 'ok');
  });
  await Promise.all([loadRoster(), loadLineups(), loadSessions()]);
  renderStatStrip();
  switchTab('overview');
}
function setStatus(msg, cls){
  const el = $('global-status');
  el.className = 'status-line' + (cls ? ' '+cls : '');
  el.textContent = msg;
  if(msg) setTimeout(()=>{ if(el.textContent===msg){ el.textContent=''; el.className='status-line'; } }, 3000);
}

/* ========================= Compute helpers ========================= */
// Merges same-date session records (e.g. Elite + Sub uploaded separately)
// into one "war day" summary — used anywhere Overview reports on
// sessions/results, so the count and outcome reflect actual war days,
// not raw saved uploads. (Session Log intentionally still shows every
// individual saved record — this only affects the Overview summary.)
function getSessionDays(){
  const byDate = {};
  sessions.forEach(s=>{
    const d = s.date || '';
    if(!byDate[d]) byDate[d] = [];
    byDate[d].push(s);
  });
  return Object.keys(byDate).map(d=>{
    const records = [...byDate[d]].sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
    const eventNames = [...new Set(records.map(r=>r.event_name).filter(Boolean))];
    const roles = [...new Set(records.map(r=>r.role).filter(Boolean))];
    const opponents = [...new Set(records.map(r=>r.opposing_guild).filter(Boolean))];
    let our_score = null, opponent_score = null;
    for(const r of records){
      if((r.our_score!==null && r.our_score!==undefined) || (r.opponent_score!==null && r.opponent_score!==undefined)){
        our_score = r.our_score; opponent_score = r.opponent_score; break;
      }
    }
    return {
      date: d,
      event_name: eventNames[0] || 'WoE',
      role: roles.join(' + '),
      opposing_guild: opponents[0] || '',
      our_score, opponent_score,
      entries: records.flatMap(r=>r.entries||[]),
      recordIds: records.map(r=>r.id),
      recordCount: records.length,
    };
  });
}
function computeSessionRecord(){
  let wins=0, losses=0, ties=0, scored=0;
  getSessionDays().forEach(s=>{
    const hasOur = s.our_score!==null && s.our_score!==undefined;
    const hasOpp = s.opponent_score!==null && s.opponent_score!==undefined;
    if(hasOur || hasOpp){
      scored++;
      const diff = Number(s.our_score||0) - Number(s.opponent_score||0);
      if(diff>0) wins++; else if(diff<0) losses++; else ties++;
    }
  });
  return { wins, losses, ties, scored };
}
function sessionOutcome(s){
  const hasOur = s.our_score!==null && s.our_score!==undefined;
  const hasOpp = s.opponent_score!==null && s.opponent_score!==undefined;
  if(!hasOur && !hasOpp) return null;
  const diff = Number(s.our_score||0) - Number(s.opponent_score||0);
  return diff>0 ? 'WIN' : (diff<0 ? 'LOSS' : 'TIE');
}
function computeMvpCounts(){
  const counts = {};
  sessions.forEach(s=>(s.entries||[]).forEach(e=>{
    if(e.rank && String(e.rank).toUpperCase()==='MVP') counts[e.name] = (counts[e.name]||0)+1;
  }));
  return counts;
}
function blankMember(name){ return { name, id:null, mmid:'', job:'', sessions:0, tablets:0, monsters:0, kills:0, assists:0, deaths:0, scoreSum:0, best:0 }; }
function computeRosterStats(){
  // Attendance is based on unique WAR DAYS, not raw saved records — if you
  // upload Elite and Sub scoreboards as two separate saves for the same
  // date, that's one war day, not two chances to "attend."
  const uniqueDates = [...new Set(sessions.map(s=>s.date).filter(Boolean))];
  const totalDays = uniqueDates.length;
  const map = {};
  roster.forEach(m=>{ map[m.name]=blankMember(m.name); map[m.name].id=m.id; map[m.name].mmid=m.mmid||''; map[m.name].job=m.job||''; });
  const attendedDates = {}; // name -> Set of dates they appeared on
  sessions.forEach(s=>(s.entries||[]).forEach(r=>{
    if(!map[r.name]) map[r.name]=blankMember(r.name);
    const m=map[r.name];
    m.tablets+=r.tablets; m.monsters+=r.monsters; m.kills+=r.kills; m.assists+=r.assists; m.deaths+=r.deaths;
    m.scoreSum+=r.score; if(r.score>m.best) m.best=r.score;
    if(!attendedDates[r.name]) attendedDates[r.name] = new Set();
    if(s.date) attendedDates[r.name].add(s.date);
  }));
  return Object.values(map).map(m=>{
    const daysAttended = (attendedDates[m.name] || new Set()).size;
    return { ...m, sessions: daysAttended, attendance: totalDays?(daysAttended/totalDays*100):0, avgScore: daysAttended?(m.scoreSum/daysAttended):0 };
  });
}

/* ========================= Overview ========================= */
function renderOverviewTab(){
  if(sessions.length===0 && roster.length===0){
    $('overview-content').innerHTML = '<h2 class="section-title">Overview</h2><p class="section-hint">Guild performance at a glance.</p><div class="empty-state">Nothing recorded yet. Add your roster in Full Roster or record a session in New Record to get started.</div>';
    return;
  }
  const record = computeSessionRecord();
  const winRate = record.scored ? Math.round(record.wins/record.scored*100) : null;
  const rosterStats = computeRosterStats();
  const mvpCounts = computeMvpCounts();
  const sessionDays = getSessionDays();
  const topAvg = rosterStats.filter(m=>m.sessions>0).sort((a,b)=>b.avgScore-a.avgScore).slice(0,5);
  const topHighPriest = rosterStats.filter(m=>m.sessions>0 && m.job==='High Priest').sort((a,b)=>b.avgScore-a.avgScore).slice(0,5);
  const topMvp = Object.entries(mvpCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topAttendance = sessions.length ? [...rosterStats].sort((a,b)=>b.attendance-a.attendance).slice(0,5) : [];
  const jobCounts = {};
  roster.forEach(m=>{ if(m.job) jobCounts[m.job]=(jobCounts[m.job]||0)+1; });
  const jobList = Object.entries(jobCounts).sort((a,b)=>b[1]-a[1]);
  const maxJobCount = jobList.length ? jobList[0][1] : 1;
  const recentSessions = [...sessionDays].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);

  $('overview-content').innerHTML = `
    <h2 class="section-title">Overview</h2>
    <p class="section-hint">Guild performance at a glance — record, top performers, attendance, and class balance. Records saved on the same date (e.g. Elite and Sub uploaded separately) count as one war day throughout.</p>
    <div class="stat-card-grid">
      <div class="stat-card"><div class="stat-value">${sessionDays.length}</div><div class="stat-label">Sessions Recorded</div></div>
      <div class="stat-card"><div class="stat-value">${roster.length}</div><div class="stat-label">Guildmates</div></div>
      <div class="stat-card"><div class="stat-value">${record.scored ? `${record.wins}-${record.losses}${record.ties?'-'+record.ties:''}` : '—'}</div><div class="stat-label">Win – Loss${record.ties?' – Tie':''}</div></div>
      <div class="stat-card"><div class="stat-value">${winRate!==null ? winRate+'%' : '—'}</div><div class="stat-label">Win Rate</div></div>
    </div>
    <div class="dash-grid">
      <div class="dash-panel">
        <h3>Recent Sessions</h3>
        ${recentSessions.length ? recentSessions.map(s=>{
          const outcome = sessionOutcome(s);
          const cls = outcome==='WIN'?'attn-high':(outcome==='LOSS'?'attn-low':'attn-mid');
          return `<div class="recent-row" data-jump-session="${s.recordIds[0]}">
            <div>
              <div class="recent-row-title">${escapeHtml(s.event_name)}${s.opposing_guild?' vs '+escapeHtml(s.opposing_guild):''}</div>
              <div class="recent-row-meta">${s.date||''}${s.role?' · '+escapeHtml(s.role):''}</div>
            </div>
            ${outcome?`<span class="outcome-tag ${cls}" style="border-color:currentColor;">${outcome}</span>`:''}
          </div>`;
        }).join('') : '<div class="empty-state" style="padding:14px 4px;">No sessions yet.</div>'}
      </div>
      <div class="dash-panel">
        <h3>Top Average Score</h3>
        ${topAvg.length ? topAvg.map((m,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span>${jobIconSvg(m.job)}<span class="lb-name">${escapeHtml(m.name)}</span><span class="lb-value">${m.avgScore.toFixed(0)}</span></div>`).join('') : '<div class="empty-state" style="padding:14px 4px;">No scored sessions yet.</div>'}
      </div>
      <div class="dash-panel">
        <h3>Top High Priest</h3>
        ${topHighPriest.length ? topHighPriest.map((m,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span>${jobIconSvg(m.job)}<span class="lb-name">${escapeHtml(m.name)}</span><span class="lb-value">${m.avgScore.toFixed(0)}</span></div>`).join('') : '<div class="empty-state" style="padding:14px 4px;">No High Priest sessions yet.</div>'}
      </div>
      <div class="dash-panel">
        <h3>Most MVPs</h3>
        ${topMvp.length ? topMvp.map(([name,count],i)=>{
          const job=(roster.find(m=>m.name===name)||{}).job||'';
          return `<div class="lb-row"><span class="lb-rank">${i+1}</span>${jobIconSvg(job)}<span class="lb-name">${escapeHtml(name)}</span><span class="lb-value">${count}</span></div>`;

      </div>
      <div class="dash-panel">

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(',')[1]);
    r.onerror=()=>reject(new Error('Could not read file'));
    r.readAsDataURL(file);
  });
}
async function handleScanFiles(fileList){
  const files = Array.from(fileList||[]).filter(f=>f.type && f.type.startsWith('image/'));
  if(files.length===0) return;
  const statusEl = $('nf-scan-status');
  for(const file of files){
    statusEl.className='status-line'; statusEl.textContent='Reading '+file.name+'…';
    try{
      const base64 = await fileToBase64(file);
      const res = await fetch('/api/scan', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ imageBase64: base64, mediaType: file.type })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Scan failed');
      if(!data.rows || data.rows.length===0) throw new Error('No rows found');
      draftEntries = draftEntries.concat(data.rows);
      statusEl.className='status-line ok';
      statusEl.textContent = 'Added '+data.rows.length+' row(s) from '+file.name+'.';
    }catch(err){
      statusEl.className='status-line error';
      statusEl.textContent = "Couldn't read "+file.name+" — "+(err.message||'try again or add rows manually.');
    }
  }
  renderDraftTable();
}

async function saveSession(){
  draftEventName = ($('nf-event').value||'WoE').trim() || 'WoE';
  draftDate = $('nf-date').value || draftDate;
  draftOpposingGuild = ($('nf-opp').value||'').trim();
  draftRole = $('nf-role').value || '';
  draftOurScore = $('nf-our-score').value || '';
  draftOpponentScore = $('nf-opp-score').value || '';

  const cleaned = draftEntries.filter(r=>r.name && r.name.trim().length>0);
  if(cleaned.length===0){ setStatus('Add at least one player row first', 'error'); return; }

  const { data: session, error } = await sb.from('sessions').insert({
    guild_id: guildId, event_name: draftEventName, date: draftDate,
    opposing_guild: draftOpposingGuild || null, role: draftRole || null,
    our_score: draftOurScore===''?null:Number(draftOurScore),
    opponent_score: draftOpponentScore===''?null:Number(draftOpponentScore),
  }).select('id').single();
  if(error){ setStatus("Couldn't save session.", 'error'); return; }

  const entryRows = cleaned.map(r=>({ session_id: session.id, rank:r.rank||'', name:r.name, tablets:r.tablets||0, monsters:r.monsters||0, kills:r.kills||0, assists:r.assists||0, deaths:r.deaths||0, score:r.score||0 }));
  await sb.from('session_entries').insert(entryRows);

  draftEntries=[]; draftEventName='WoE'; draftOpposingGuild=''; draftRole=''; draftOurScore=''; draftOpponentScore='';
  await loadSessions();
  renderStatStrip();
  setStatus('Session saved.', 'ok');
  expandedSessionId = session.id;
  switchTab('log');
}

    <table class="responsive">
      <thead><tr><th>Rank</th><th>Name</th><th class="num">Tablets</th><th class="num">Monsters</th><th class="num">Kills</th><th class="num">Assists</th><th class="num">Deaths</th><th class="num">Score</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr>
          <td data-label="Rank">${isMvp(r)?'<span class="mvp-seal">&#9733;</span>MVP':escapeHtml(r.rank||'—')}</td>
          <td data-label="Name">${escapeHtml(r.name)}</td>

          <td class="num" data-label="Assists">${r.assists}</td>
          <td class="num" data-label="Deaths">${r.deaths}</td>

async function handleRosterExcelFile(file){
  if(!file) return;
  const statusEl = $('fr-import-status');
  const setImportStatus = (cls,msg)=>{ const el=$('fr-import-status'); if(el){ el.className='status-line'+(cls?' '+cls:''); el.textContent=msg; } };
  setImportStatus('', 'Reading '+file.name+'…');
  try{
    if(typeof XLSX === 'undefined') throw new Error('Import library not loaded');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });

    let mmidIdx=0, nameIdx=1, jobIdx=2, startRow=0;
    if(rows.length){
      const header = rows[0].map(c=>String(c||'').trim().toLowerCase());
      const ni = header.indexOf('name');
      if(ni>=0){
        mmidIdx = header.indexOf('mmid'); if(mmidIdx<0) mmidIdx = header.indexOf('uid');
        nameIdx = ni;
        jobIdx = header.indexOf('job');
        startRow = 1;
      }
    }
    const parsed = [];
    for(let i=startRow;i<rows.length;i++){
      const row = rows[i];
      const name = String((nameIdx>=0 ? row[nameIdx] : row[1]) || '').trim();
      if(!name) continue;
      const mmid = String((mmidIdx>=0 ? row[mmidIdx] : row[0]) || '').trim();
      const job = String((jobIdx>=0 ? row[jobIdx] : row[2]) || '').trim();
      parsed.push({ mmid, name, job });
    }
    if(parsed.length===0) throw new Error('No rows found');

    let added=0, updated=0;
    for(const p of parsed){
      const existing = roster.find(m=>m.name===p.name);
      if(existing){
        await sb.from('roster_members').update({ mmid:p.mmid, job:p.job }).eq('id', existing.id);
        updated++;
      } else {
        const { error } = await sb.from('roster_members').insert({ guild_id:guildId, mmid:p.mmid, name:p.name, job:p.job });
        if(!error) added++;
      }
    }
    await loadRoster();
    renderStatStrip();
    renderFullRosterTab();
    setImportStatus('ok', `Imported ${parsed.length} row(s) — ${added} new, ${updated} updated.`);
  }catch(err){
    setImportStatus('error', "Couldn't read that file. Use a .xlsx, .xls, or .csv with Name (and optionally UID/Job) columns.");
  }
}

function exportRosterExcel(){
  if(typeof XLSX === 'undefined'){ setStatus('Export library not loaded.', 'error'); return; }
  const sorted = [...roster].sort((a,b)=>{
    const av=(a[fullRosterSort.key]||'').toString(), bv=(b[fullRosterSort.key]||'').toString();
    return av.localeCompare(bv,undefined,{numeric:true}) * (fullRosterSort.dir==='asc'?1:-1);
  });
  const aoa = [['UID','Name','Job'], ...sorted.map(m=>[m.mmid||'', m.name||'', m.job||''])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:10},{wch:24},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Roster');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `guild-roster-${stamp}.xlsx`);
}

      if(parts[0] && ['mmid','uid'].includes(parts[0].toLowerCase())) return;
      if(parts.length>=3) rows.push({guild_id:guildId, mmid:parts[0], name:parts[1], job:parts[2]});
      else if(parts.length===2) rows.push({guild_id:guildId, mmid:'', name:parts[0], job:parts[1]});
      else if(parts.length===1 && parts[0]) rows.push({guild_id:guildId, mmid:'', name:parts[0], job:''});
    });
    if(rows.length){
      const { error } = await sb.from('roster_members').insert(rows);
      if(error) setStatus("Some rows couldn't be added (duplicate names?).", 'error');
      await loadRoster(); renderStatStrip(); renderFullRosterTab();
      setStatus('Added members.', 'ok');
    }
  });
  document.querySelectorAll('[data-fr-remove]').forEach(btn=>btn.addEventListener('click', async ()=>{
    await sb.from('roster_members').delete().eq('id', btn.dataset.frRemove);
    await loadRoster(); renderStatStrip(); renderFullRosterTab();
  }));
  document.querySelectorAll('[data-fr-field]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const id = el.dataset.frId, field = el.dataset.frField;
      await sb.from('roster_members').update({[field]: el.value}).eq('id', id);
      const m = roster.find(x=>x.id===id);
      if(m) m[field] = el.value;
      if(field==='job'){
        const cell = el.closest('.job-cell');
        if(cell){ const oldIcon=cell.querySelector('.job-icon'); if(oldIcon) oldIcon.remove(); cell.insertAdjacentHTML('afterbegin', jobIconSvg(el.value)); }
      }
    });
  });
  document.querySelectorAll('[data-sort-roster]').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.sortRoster;
    if(fullRosterSort.key===key) fullRosterSort.dir = fullRosterSort.dir==='asc'?'desc':'asc';
    else fullRosterSort = {key, dir:'asc'};
    renderFullRosterTab();
  }));
}

/* ========================= Attendance ========================= */
function renderAttendanceTab(){
  const rosterStats = computeRosterStats();
  const sorted = [...rosterStats].sort((a,b)=>{
    const dir = attendanceSort.dir==='asc'?1:-1;
    const av=a[attendanceSort.key], bv=b[attendanceSort.key];
    if(typeof av==='string') return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });
  const cols = [
    {key:'name',label:'Name'},{key:'job',label:'Job'},{key:'sessions',label:'Sessions',num:true},{key:'attendance',label:'Attend %',num:true},
    {key:'avgScore',label:'Avg Score',num:true},{key:'best',label:'Best',num:true},
    {key:'kills',label:'Kills',num:true},{key:'assists',label:'Assists',num:true},{key:'deaths',label:'Deaths',num:true},
    {key:'tablets',label:'Tablets',num:true},{key:'monsters',label:'Monsters',num:true}
  ];
  $('attendance-content').innerHTML = `
    <h2 class="section-title">Attendance</h2>
    <p class="section-hint">Totals across every war day, including roster members who haven't attended yet. If you save multiple records for the same date (e.g. Elite and Sub separately), they count as one day. Click a column to sort.</p>
    ${sessions.length===0 && roster.length===0 ? '<div class="empty-state">No sessions or roster yet.</div>' : `
    <table class="responsive">
      <thead><tr>
        ${cols.map(c=>`<th class="${c.num?'num ':''}sortable" data-sort-attn="${c.key}">${c.label}${attendanceSort.key===c.key?(attendanceSort.dir==='asc'?' \u25B2':' \u25BC'):''}</th>`).join('')}
      </tr></thead>
      <tbody>${sorted.map(m=>{
        const cls = m.attendance>=75?'attn-high':(m.attendance>=40?'attn-mid':'attn-low');
        const jobCell = `<div class="job-cell">${jobIconSvg(m.job)}<select class="roster-job-select" data-attn-job-id="${m.id||''}" data-attn-name="${escapeHtml(m.name)}" data-attn-current="${escapeHtml(m.job||'')}"></select></div>`;
        return `<tr>
          <td data-label="Name">${escapeHtml(m.name)}</td>
          <td data-label="Job">${jobCell}</td>
          <td class="num" data-label="Sessions">${m.sessions}</td>
          <td class="num ${cls}" data-label="Attend %">${m.attendance.toFixed(0)}%</td>
          <td class="num" data-label="Avg Score">${m.avgScore.toFixed(0)}</td>
          <td class="num" data-label="Best">${m.best}</td>
          <td class="num" data-label="Kills">${m.kills}</td>
          <td class="num" data-label="Assists">${m.assists}</td>
          <td class="num" data-label="Deaths">${m.deaths}</td>
          <td class="num" data-label="Tablets">${m.tablets}</td>
          <td class="num" data-label="Monsters">${m.monsters}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`}
  `;
  const usedJobs = [...new Set(roster.map(r=>r.job).filter(Boolean))].sort();
  const existingJobs = usedJobs.length ? usedJobs : JOB_OPTIONS;
  document.querySelectorAll('[data-attn-job-id]').forEach(sel=>{
    const name = sel.dataset.attnName;
    const current = sel.dataset.attnCurrent || '';
    sel.innerHTML = '<option value="">— Select —</option>' + existingJobs.map(j=>`<option value="${j}" ${j===current?'selected':''}>${j}</option>`).join('');
    sel.addEventListener('change', async ()=>{
      const newJob = sel.value;
      const id = sel.dataset.attnJobId;
      if(id){
        const { error } = await sb.from('roster_members').update({ job:newJob }).eq('id', id);
        if(error){ setStatus('Could not save job: '+error.message, 'error'); return; }
        const rm = roster.find(x=>x.id===id);
        if(rm) rm.job = newJob;
      } else {
        // This name isn't on the roster yet (session-only) — add them.
        const { data, error } = await sb.from('roster_members').insert({ guild_id:guildId, name, job:newJob }).select().single();
        if(error){ setStatus('Could not save job: '+error.message, 'error'); return; }
        roster.push(data);
        sel.dataset.attnJobId = data.id;
      }
      sel.dataset.attnCurrent = newJob;
      const cell = sel.closest('.job-cell');
      if(cell){ const oldIcon=cell.querySelector('.job-icon'); if(oldIcon) oldIcon.remove(); cell.insertAdjacentHTML('afterbegin', jobIconSvg(newJob)); }
    });
  });
  document.querySelectorAll('[data-sort-attn]').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.sortAttn;
    if(attendanceSort.key===key) attendanceSort.dir = attendanceSort.dir==='asc'?'desc':'asc';
    else attendanceSort = {key, dir: key==='name'?'asc':'desc'};
    renderAttendanceTab();
  }));
}

/* ========================= Party lineups list ========================= */
function placedCount(teams){
  return (teams||[]).reduce((s,t)=>s+t.parties.reduce((s2,p)=>s2+p.slots.filter(x=>x.name).length,0),0);
}
function renderLineupsList(){
  $('lineups-list').innerHTML = lineups.length ? lineups.map(l=>`
    <div class="lineup-card">
      <div>
        <div class="lineup-title"><a data-open-lineup="${l.id}">${escapeHtml(l.name)}</a> — ${l.date||''}</div>
        <div class="lineup-meta">${[l.map_name, l.opposing_guild?('vs '+l.opposing_guild):null].filter(Boolean).join(' · ')}</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span class="lineup-meta">${placedCount(l.teams)} placed</span>
        <button class="btn ghost small" data-copy-link="${l.share_slug}">Copy Share Link</button>
        <button class="btn danger small" data-delete-lineup="${l.id}">Delete</button>
      </div>
    </div>
  `).join('') : '<div class="empty-state">No lineups yet.</div>';

  document.querySelectorAll('[data-open-lineup]').forEach(el=>el.addEventListener('click', ()=>openEditor(el.dataset.openLineup)));
  document.querySelectorAll('[data-copy-link]').forEach(el=>el.addEventListener('click', ()=>{
    const url = `${location.origin}${location.pathname.replace('index.html','')}view.html?slug=${el.dataset.copyLink}`;
    navigator.clipboard.writeText(url);
    setStatus('Share link copied.', 'ok');
  }));
  document.querySelectorAll('[data-delete-lineup]').forEach(el=>el.addEventListener('click', async ()=>{
    if(!confirm("Delete this lineup? This can't be undone.")) return;
    await sb.from('party_lineups').delete().eq('id', el.dataset.deleteLineup);
    await loadLineups(); renderLineupsList();
  }));
}

function defaultTeams(){
  const emptySlot = ()=>({name:'',job:''});
  const mkTeam = (name)=>({ name, parties: Array.from({length:8},(_,i)=>({name:`Party ${i+1}`, slots: Array.from({length:5}, emptySlot)})) });
  return [mkTeam('Elite Team'), mkTeam('SUB Team')];
}
$('new-lineup-btn').addEventListener('click', async ()=>{
  const { data, error } = await sb.from('party_lineups').insert({
    guild_id: guildId, name:'New Lineup', date: todayStr(), teams: defaultTeams()
  }).select('id').single();
  if(error){ setStatus("Couldn't create lineup.", 'error'); return; }
  await loadLineups();
  openEditor(data.id);
});

/* ========================= Lineup editor ========================= */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  setStatus('Saving…');
  saveTimer = setTimeout(async ()=>{
    const { id, guild_id, share_slug, created_at, updated_at, ...rest } = currentLineup;
    await sb.from('party_lineups').update(rest).eq('id', id);
    setStatus('Saved.', 'ok');
    const idx = lineups.findIndex(l=>l.id===id);
    if(idx>=0) lineups[idx] = { ...lineups[idx], ...rest };
  }, 500);
}
let currentLineupAbsences = [];
async function openEditor(id){
  TAB_IDS.forEach(t=>$(t+'-tab').classList.add('hidden'));
  $('editor-tab').classList.remove('hidden');
  $('editor-content').innerHTML = '<div class="status-line">Loading…</div>';
  const { data: fresh } = await sb.from('party_lineups').select('*').eq('id', id).single();
  currentLineup = fresh || lineups.find(l=>l.id===id);
  if(fresh){ const idx = lineups.findIndex(l=>l.id===id); if(idx>=0) lineups[idx] = fresh; }
  currentLineupAbsences = [];
  renderEditor();
  const { data } = await sb.from('absences').select('*').eq('lineup_id', id).order('member_name');
  currentLineupAbsences = data || [];
  const box = $('editor-absences');
  if(box) box.outerHTML = tplAbsences();
}
function tplAbsences(){
  return `<div id="editor-absences">${currentLineupAbsences.length ? `
    <div style="margin:14px 0 4px; padding:12px 16px; border:1px solid var(--magenta); background:rgba(255,61,110,.06);">
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--magenta);margin-bottom:8px;">Marked Absent (${currentLineupAbsences.length}) — from the share link</div>
      ${currentLineupAbsences.map(a=>`<span class="chip">${escapeHtml(a.member_name)} — ${escapeHtml(a.absent_date)}</span>`).join('')}
    </div>
  ` : ''}</div>`;
}
function backToList(){
  currentLineup = null;
  switchTab('parties');
}
function countByName(){
  const counts = {};
  currentLineup.teams.forEach(t=>t.parties.forEach(p=>p.slots.forEach(s=>{ if(s.name) counts[s.name]=(counts[s.name]||0)+1; })));
  return counts;
}
function linkStatusHtml(l){
  if(!l.share_expires_at) return '';
  const expired = new Date(l.share_expires_at).getTime() < Date.now();
  return `<div style="font-size:11.5px; margin-top:6px; color:${expired?'var(--magenta)':'var(--ink-faint)'};">
    ${expired ? 'Link expired' : 'Link active — expires ' + new Date(l.share_expires_at).toLocaleString()}
  </div>`;
}
function renderEditor(){
  const l = currentLineup;
  const counts = countByName();
  const assignedNames = new Set(Object.keys(counts));
  const unassigned = roster.filter(m=>!assignedNames.has(m.name)).map(m=>m.name).sort();

  $('editor-content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
      <div style="flex:1 1 320px;">
        <button class="btn ghost small" id="back-btn" style="margin-bottom:14px;">&larr; All Lineups</button>
        <div class="field-row">
          <div style="flex:2 1 220px;"><label>Lineup Name</label><input type="text" id="f-name" value="${escapeHtml(l.name)}"></div>
          <div style="flex:1 1 140px;"><label>Date</label><input type="date" id="f-date" value="${l.date||''}"></div>
        </div>
        <div class="field-row">
          <div><label>Map Name</label><input type="text" id="f-map" placeholder="e.g. Prontera Castle" value="${escapeHtml(l.map_name||'')}"></div>
          <div><label>Opposing Guild</label><input type="text" id="f-opp" placeholder="Enemy guild name" value="${escapeHtml(l.opposing_guild||'')}"></div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          <button class="btn gold small" id="copy-share-btn">Copy Share Link</button>
          <button class="btn ghost small" id="renew-link-btn">Renew Link (24h)</button>
          <button class="btn danger small" id="delete-lineup-btn">Delete Lineup</button>
        </div>
        ${linkStatusHtml(l)}
      </div>
    </div>
    ${tplAbsences()}
    ${l.teams.map((team,ti)=>tplTeam(team,ti)).join('')}
    <button class="btn gold small" id="add-team-btn" style="margin-bottom:20px;">+ Add Team</button>
    <h3 class="section-title" style="font-size:14px;">Unassigned (${unassigned.length})</h3>
    <div>${unassigned.length ? unassigned.map(n=>`<span class="chip">${escapeHtml(n)}</span>`).join('') : '<div style="font-size:13px;color:var(--ink-soft);">Everyone is placed.</div>'}</div>
  `;

  $('back-btn').addEventListener('click', backToList);
  $('f-name').addEventListener('input', e=>{ currentLineup.name = e.target.value; scheduleSave(); });
  $('f-date').addEventListener('change', e=>{ currentLineup.date = e.target.value; scheduleSave(); });
  $('f-map').addEventListener('input', e=>{ currentLineup.map_name = e.target.value; scheduleSave(); });
  $('f-opp').addEventListener('input', e=>{ currentLineup.opposing_guild = e.target.value; scheduleSave(); });
  $('copy-share-btn').addEventListener('click', ()=>{
    const url = `${location.origin}${location.pathname.replace('index.html','')}view.html?slug=${currentLineup.share_slug}`;
    navigator.clipboard.writeText(url);
    const expired = currentLineup.share_expires_at && new Date(currentLineup.share_expires_at).getTime() < Date.now();
    setStatus(expired ? 'Link copied — but it\'s expired, click Renew Link first.' : 'Share link copied.', expired ? 'error' : 'ok');
  });
  $('renew-link-btn').addEventListener('click', async ()=>{
    const newExpiry = new Date(Date.now() + 24*60*60*1000).toISOString();
    await sb.from('party_lineups').update({ share_expires_at: newExpiry }).eq('id', currentLineup.id);
    currentLineup.share_expires_at = newExpiry;
    const idx = lineups.findIndex(x=>x.id===currentLineup.id);
    if(idx>=0) lineups[idx].share_expires_at = newExpiry;
    setStatus('Link renewed for another 24 hours.', 'ok');
    renderEditor();
  });
  $('delete-lineup-btn').addEventListener('click', async ()=>{
    if(!confirm("Delete this lineup? This can't be undone.")) return;
    await sb.from('party_lineups').delete().eq('id', currentLineup.id);
    await loadLineups();
    backToList();
  });
  $('add-team-btn').addEventListener('click', ()=>{
    currentLineup.teams.push({ name:'New Team', parties:[{name:'Party 1', slots:Array.from({length:5},()=>({name:'',job:''}))}] });
    scheduleSave(); renderEditor();
  });

  document.querySelectorAll('[data-team-name]').forEach(inp=>inp.addEventListener('input', e=>{
    currentLineup.teams[+inp.dataset.teamName].name = e.target.value; scheduleSave();
  }));
  document.querySelectorAll('[data-remove-team]').forEach(btn=>btn.addEventListener('click', ()=>{
    currentLineup.teams.splice(+btn.dataset.removeTeam,1); scheduleSave(); renderEditor();
  }));
  document.querySelectorAll('[data-add-party]').forEach(btn=>btn.addEventListener('click', ()=>{
    const ti = +btn.dataset.addParty;
    const parties = currentLineup.teams[ti].parties;
    parties.push({ name:`Party ${parties.length+1}`, slots:Array.from({length:5},()=>({name:'',job:''})) });
    scheduleSave(); renderEditor();
  }));
  document.querySelectorAll('[data-party-name]').forEach(inp=>inp.addEventListener('input', e=>{
    const [ti,pi] = inp.dataset.partyName.split('-').map(Number);
    currentLineup.teams[ti].parties[pi].name = e.target.value; scheduleSave();
  }));
  document.querySelectorAll('[data-remove-party]').forEach(btn=>btn.addEventListener('click', ()=>{
    const [ti,pi] = btn.dataset.removeParty.split('-').map(Number);
    currentLineup.teams[ti].parties.splice(pi,1); scheduleSave(); renderEditor();
  }));
  document.querySelectorAll('[data-slot]').forEach(btn=>btn.addEventListener('click', ()=>{
    const [ti,pi,si] = btn.dataset.slot.split('-').map(Number);
    openPicker(ti,pi,si);
  }));
}
function tplTeam(team, ti){
  return `
    <div class="team-block">
      <div class="team-header">
        <input class="team-name-input" data-team-name="${ti}" value="${escapeHtml(team.name)}">
        <div style="display:flex; gap:8px;">
          <button class="btn ghost small" data-add-party="${ti}">+ Party</button>
          <button class="btn danger small" data-remove-team="${ti}">Remove Team</button>
        </div>
      </div>
      <div class="party-grid">${team.parties.map((p,pi)=>tplParty(p,ti,pi)).join('')}</div>
    </div>
  `;
}
function tplParty(party, ti, pi){
  const counts = countByName();
  return `
    <div class="party-card">
      <div class="party-card-head">
        <input class="party-name-input" data-party-name="${ti}-${pi}" value="${escapeHtml(party.name)}">
        <button style="background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;" data-remove-party="${ti}-${pi}" title="Remove this party">&times;</button>
      </div>
      ${party.slots.map((slot,si)=>{
        const isDup = slot.name && counts[slot.name] > 1;
        const label = slot.name ? `${slot.name}${slot.job?' — '+slot.job:''}` : '— empty —';
        return `<button class="slot-btn ${isDup?'dup-slot':''}" data-slot="${ti}-${pi}-${si}">
          <span class="slot-btn-label">${jobIconSvg(slot.job)}<span class="slot-label-text">${escapeHtml(label)}</span></span>
          <span style="color:var(--ink-soft); font-size:11px;">&#9662;</span>
        </button>`;
      }).join('')}
    </div>
  `;
}

/* ========================= Assignment picker ========================= */
function openPicker(ti,pi,si){
  picker = {ti,pi,si};
  $('assign-search').value = '';
  const jobs = [...new Set(roster.map(m=>m.job).filter(Boolean))].sort();
  $('assign-job-filter').innerHTML = '<option value="">All Jobs</option>' + jobs.map(j=>`<option value="${j}">${j}</option>`).join('');
  $('assign-job-filter').value = '';
  renderPickerOptions();
  $('assign-popover').classList.remove('hidden');
  setTimeout(()=>$('assign-search').focus(), 0);
}
function closePicker(){ picker = null; $('assign-popover').classList.add('hidden'); }
function renderPickerOptions(){
  if(!picker) return;
  const { ti,pi,si } = picker;
  const currentVal = currentLineup.teams[ti].parties[pi].slots[si].name;
  const jobFilter = $('assign-job-filter').value;
  const search = $('assign-search').value.trim().toLowerCase();
  const counts = countByName();

  let list = roster.slice();
  if(jobFilter) list = list.filter(m=>(m.job||'')===jobFilter);
  if(search) list = list.filter(m=>m.name.toLowerCase().includes(search));
  list = list.filter(m=>{
    const usedElsewhere = m.name===currentVal ? (counts[m.name]||0)>1 : (counts[m.name]||0)>0;
    return !usedElsewhere;
  });
  list.sort((a,b)=>a.name.localeCompare(b.name));

  const emptyRow = `<div class="assign-option ${!currentVal?'is-selected':''}" data-pick="">— empty —</div>`;
  const rows = list.map(m=>`
    <div class="assign-option ${m.name===currentVal?'is-selected':''}" data-pick="${escapeHtml(m.name)}">
      <span>${escapeHtml(m.name)}</span>
      <span class="assign-option-job">${jobIconSvg(m.job)}${escapeHtml(m.job||'')}</span>
    </div>
  `).join('');
  $('assign-options').innerHTML = emptyRow + (rows || '<div style="padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;">No matches</div>');

  document.querySelectorAll('[data-pick]').forEach(row=>row.addEventListener('click', ()=>{
    const name = row.dataset.pick;
    const job = name ? (roster.find(m=>m.name===name)||{}).job||'' : '';
    currentLineup.teams[ti].parties[pi].slots[si] = { name, job };
    scheduleSave();
    closePicker();
    renderEditor();
  }));
}
$('assign-search').addEventListener('input', renderPickerOptions);
$('assign-job-filter').addEventListener('change', renderPickerOptions);
$('assign-popover').addEventListener('click', (e)=>{ if(e.target.id==='assign-popover') closePicker(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && picker) closePicker(); });

/* ========================= Init ========================= */
if(localStorage.getItem(AUTH_FLAG_KEY) === '1'){
  showApp();
} else {
  $('login-section').classList.remove('hidden');
}
</script>
</body>
