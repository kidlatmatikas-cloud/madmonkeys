<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild War Log — Party Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13151a; --bg-panel:#1a1d24; --bg-panel-2:#15171d; --bg-elevated:#20232c;
  --ink:#eceef2; --ink-soft:#8b93a1; --ink-faint:#575e6b;
  --cyan:#5b8def; --cyan-dim:#4a78c9; --magenta:#e5535c; --green:#3ecf8e; --gold:#dc9a3d;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13); --shadow:rgba(0,0,0,.28);
}
*{box-sizing:border-box;}
body{margin:0;}
html,body{
  background:var(--bg);
  color:var(--ink); font-family:'Inter',sans-serif; font-weight:400; font-size:15.5px; line-height:1.55; min-height:100vh;
}
a{color:var(--cyan);}
.wrap{ max-width:1900px; width:94%; margin:0 auto; padding:32px 0 70px; }
.masthead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:16px; margin-bottom:8px; border-bottom:1px solid var(--line-strong); flex-wrap:wrap; }
.masthead h1{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:-.01em; font-size:clamp(19px,2vw,26px); margin:0; }
.masthead .sub{ font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
label{ font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:600; }
input[type=text], input[type=date], input[type=email], input[type=number], select, textarea{
  font-family:'Inter',sans-serif; font-weight:500; font-size:14.5px; color:var(--ink); background:var(--bg-panel-2);
  border:1px solid var(--line); border-radius:7px; padding:9px 12px; width:100%;
}
input:focus, select:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(91,141,239,.18); }
.field-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.field-row > div{ flex:1 1 160px; }
.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px; letter-spacing:0; cursor:pointer;
  padding:9px 17px; border:1px solid var(--cyan); background:transparent; color:var(--cyan);
  border-radius:7px; transition:background .12s, border-color .12s;
}
.btn:hover{ background:rgba(91,141,239,.12); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.gold{ border-color:var(--gold); color:var(--gold); }
.btn.gold:hover{ background:rgba(220,154,61,.12); }
.btn.ghost{ border-color:var(--line-strong); color:var(--ink-soft); }
.btn.ghost:hover{ color:var(--ink); background:rgba(255,255,255,.04); }
.btn.danger{ border-color:var(--magenta); color:var(--magenta); }
.btn.danger:hover{ background:rgba(229,83,92,.12); }
.btn.small{ padding:6px 12px; font-size:12px; }
.hud-panel{ position:relative; background:var(--bg-panel); border:1px solid var(--line-strong); border-radius:12px; padding:30px 32px; box-shadow:0 4px 20px var(--shadow); margin-top:20px; }
.corner{ display:none; }
.section-title{ font-family:'Inter',sans-serif; font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0 0 8px; }
.event-title{ font-family:'Inter',sans-serif; font-size:30px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px; color:var(--cyan); }
.section-hint{ font-size:15.5px; color:var(--ink-soft); margin:0 0 18px; max-width:70ch; line-height:1.6; }
.status-line{ font-size:13.5px; margin-top:10px; color:var(--ink-soft); min-height:18px; }
.status-line.error{ color:var(--magenta); }
.status-line.ok{ color:var(--green); }
.empty-state{ padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:14.5px; }
.job-icon{ width:20px; height:20px; flex:0 0 auto; display:inline-block; vertical-align:middle; }
.hidden{ display:none !important; }
.chip{ display:inline-flex; align-items:center; gap:7px; background:var(--bg-panel-2); border:1px solid var(--line-strong); border-radius:20px; padding:7px 14px; margin:4px 5px 4px 0; font-size:14px; font-family:'Inter',sans-serif; font-weight:500; }
.chip button{ background:none; border:none; color:var(--magenta); cursor:pointer; font-size:13px; padding:0; }
/* team / party editing */
.team-name-input{ font-family:'Inter',sans-serif; font-weight:700; font-size:19px; letter-spacing:-.005em; background:transparent; border:none; color:var(--cyan); max-width:280px; padding:2px 0; border-bottom:1px dashed transparent; }
.team-name-input:focus,.team-name-input:hover{ border-bottom:1px dashed var(--cyan); outline:none; }
.team-header{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--line-strong); }
.team-block{ margin-bottom:32px; }
.party-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:20px; margin-bottom:10px; }
@media (max-width:1000px){ .party-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:520px){ .party-grid{ grid-template-columns:1fr; } }
.party-card{ border:1px solid var(--line); background:var(--bg-panel-2); border-radius:9px; padding:16px; }
.party-card-head{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15px; color:var(--cyan-dim); margin-bottom:10px; }
.party-name-input{ background:transparent; border:none; color:var(--cyan-dim); font-weight:700; font-size:15px; padding:2px 0; flex:1 1 auto; border-bottom:1px dashed transparent; }
.party-name-input:hover,.party-name-input:focus{ border-bottom:1px dashed var(--cyan-dim); outline:none; }
.slot-btn{
  font-weight:500; font-size:16px; color:var(--ink); background:var(--bg-panel); border:1px solid var(--line);
  border-radius:7px; padding:11px 12px; width:100%; margin-bottom:9px; text-align:left; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:8px; transition:border-color .12s;
}
.slot-btn:hover{ border-color:var(--line-strong); }
.slot-btn.readonly{ cursor:default; flex-wrap:wrap; row-gap:3px; }
.slot-btn.readonly:hover{ border-color:var(--line); }
.slot-btn-label{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:7px; overflow:hidden; }
.slot-label-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slot-role-text{ font-size:11.5px; color:var(--gold); font-weight:500; }
.slot-btn.readonly .slot-role-text{ flex:1 1 100%; margin-left:29px; white-space:normal; overflow:visible; text-overflow:clip; }
.slot-btn .job-icon{ width:20px; height:20px; }
.dup-slot{ border-color:var(--magenta) !important; }
/* assignment popover */
.assign-popover{ position:fixed; inset:0; background:rgba(4,6,10,.6); z-index:60; display:flex; align-items:center; justify-content:center; }
.assign-popover.hidden{ display:none; }
.assign-card{ width:300px; max-height:400px; display:flex; flex-direction:column; background:var(--bg-elevated); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.4); }
.assign-header{ padding:10px; border-bottom:1px solid var(--line-strong); display:flex; flex-direction:column; gap:8px; }
.assign-options{ overflow-y:auto; flex:1 1 auto; }
.assign-option{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; font-family:'Inter',sans-serif; font-size:13.5px; border-bottom:1px solid var(--line); }
.assign-option:hover{ background:rgba(45,226,255,.08); }
.assign-option.is-selected{ background:rgba(45,226,255,.14); color:var(--cyan); }
.assign-option-job{ color:var(--ink-soft); font-size:11.5px; display:inline-flex; align-items:center; gap:5px; }
/* lineup list */
.lineup-card{ border:1px solid var(--line); background:rgba(255,255,255,.015); border-radius:9px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.lineup-title{ font-weight:700; font-size:15px; }
.lineup-title a{ color:var(--ink); text-decoration:none; cursor:pointer; }
.lineup-title a:hover{ color:var(--cyan); }
.lineup-meta{ font-size:12.5px; color:var(--ink-soft); font-family:'Inter',sans-serif; margin-top:2px; }
.tabs{ display:flex; gap:6px; margin:20px 0 4px; }
.tab-btn{ font-weight:600; font-size:14px; letter-spacing:0; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:7px; padding:9px 18px; cursor:pointer; color:var(--ink-soft); transition:background .12s, color .12s; }
.tab-btn.active{ color:#fff; background:var(--cyan); border-color:var(--cyan); }
/* enlarged lineup details */
.meta-bar{ display:flex; gap:32px; flex-wrap:wrap; margin:6px 0 24px; padding-bottom:20px; border-bottom:1px solid var(--line-strong); }
.meta-item{ min-width:130px; }
.meta-label{ font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:700; margin-bottom:5px; }
.meta-value{ font-family:'Inter',sans-serif; font-size:26px; font-weight:700; color:var(--cyan); line-height:1.2; }
.meta-value.plain{ color:var(--ink); text-shadow:none; }
/* absence panel */
.absence-panel select#absence-name{ font-weight:700; }
#absence-list .chip{ border-color:var(--magenta); color:var(--magenta); }
/* personal stats lookup */
.stat-card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin-top:16px; }
.stat-card{ position:relative; border:1px solid var(--line-strong); background:var(--bg-panel-2); border-radius:9px; padding:14px 16px; overflow:hidden; }
.stat-card::before{ content:""; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--cyan); }
.stat-card .stat-value{ font-family:'Inter',sans-serif; font-size:21px; font-weight:700; line-height:1.15; color:var(--ink); }
.stat-card .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-top:5px; font-weight:600; }
.dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:16px; }
.dash-panel{ position:relative; border:1px solid var(--line); background:rgba(255,255,255,.015); border-radius:9px; padding:16px; }
.dash-panel h3{ font-family:'Inter',sans-serif; font-size:12px; margin:0 0 12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.lb-row{ display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.lb-rank{ font-family:'Inter',sans-serif; color:var(--ink-faint); font-size:11.5px; width:14px; flex:0 0 auto; }
.lb-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.lb-value{ font-family:'Inter',sans-serif; font-weight:600; color:var(--cyan); flex:0 0 auto; }

</style>

<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1 id="masthead-title">// WAR LOG</h1>
      <div class="sub">View Only — Party Lineup</div>
    </div>
  </header>
  <div id="content"><div class="status-line">Loading…</div></div>
</div>

<script>
/* Same config as index.html — fill in from Supabase → Project Settings → API */
const SUPABASE_URL = 'https://ydftjgrxhrbjmzzwstnr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1Uy0YLjaqqSgk52hS3Lm4Q_0zaxPv4x';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const JOB_ICONS = {
  'High Priest':'<path d="M10 2h4v7h7v4h-7v9h-4v-9H3V9h7V2z"/>',
  'High Wizard':'<circle cx="12" cy="5" r="3"/><path d="M10.8 8.5h2.4v13.5h-2.4z"/><path d="M19 2.5l0.9 2.2 2.2 0.9-2.2 0.9-0.9 2.2-0.9-2.2-2.2-0.9 2.2-0.9z"/>',
  Paladin:'<path fill-rule="evenodd" clip-rule="evenodd" d="M12 2l8 3.2v5.6c0 5.7-3.4 9.4-8 11.2-4.6-1.8-8-5.5-8-11.2V5.2L12 2zm-1 5.5h2v3.7h3.7v2H13v3.8h-2v-3.8H7.3v-2H11V7.5z"/>',
  'Lord Knight':'<path d="M12 1l3 12H9z"/><rect x="4.5" y="13.3" width="15" height="2.2" rx="0.4"/><rect x="10.4" y="15.5" width="3.2" height="4.3" rx="0.4"/><circle cx="12" cy="21" r="1.9"/>',
  Mastersmith:'<rect x="5.5" y="2" width="13" height="7.2" rx="1.4"/><rect x="10.4" y="9.2" width="3.2" height="12.8" rx="1"/>',
  Summoner:'<circle cx="8.3" cy="6.8" r="2.1"/><circle cx="15.7" cy="6.8" r="2.1"/><circle cx="4.4" cy="11.6" r="1.9"/><circle cx="19.6" cy="11.6" r="1.9"/><path d="M12 12c-3.9 0-6.5 2.6-6.5 5.9 0 3.4 3 5.6 6.5 5.6s6.5-2.2 6.5-5.6c0-3.3-2.6-5.9-6.5-5.9z"/>',
  Sniper:'<path d="M4 2c6.8 3.1 6.8 16.9 0 20 8.7-2 10.8-9.3 10.8-10S12.7 4 4 2z"/><rect x="8.5" y="11.2" width="11.5" height="1.7"/><path d="M20 8.8l4 3.2-4 3.2z"/><path d="M8.5 9.4l3 2.6-3 2.6z"/>',
  'Assasin Cross':'<path d="M12 2l2.6 7.2L12 11l-2.6-1.8z"/><rect x="7.3" y="11" width="9.4" height="1.7" rx="0.4"/><rect x="10.5" y="12.7" width="3" height="4.2" rx="0.4"/><circle cx="12" cy="18.3" r="1.6"/>',
  Stalker:'<path d="M2 1.5c4 2.5 5.5 7 5.5 10.5S6 19.5 2 22c6-1 9-5.5 9-10.5S8 3.5 2 1.5z"/><rect x="9" y="10.3" width="14" height="3.4" rx="0.8"/>',
  Biochemist:'<path d="M9.5 2h5v1.8h-1.1v5.5l5.6 9.3c1.3 2.1-.3 4.9-2.9 4.9H7.9c-2.6 0-4.2-2.8-2.9-4.9l5.6-9.3V3.8H9.5V2z"/>',
  Rebellion:'<rect x="3" y="10" width="17" height="3.4" rx="0.8"/><rect x="20" y="10.8" width="2.6" height="1.8" rx="0.3"/><path d="M5 13.4h4.6l-1 7.6h-3.1z"/>',
  Gypsy:'<circle cx="8.2" cy="16" r="6.3"/><rect x="12.7" y="2.3" width="2.3" height="15.5" rx="1" transform="rotate(20 13.8 10)"/><circle cx="17.6" cy="4" r="2"/>',
  Minstrel:'<circle cx="6.5" cy="18.3" r="2.4"/><circle cx="16.2" cy="16.1" r="2.4"/><path d="M8.7 18.3V4.7L18.4 2.5v11.3h-1.9V5.9l-7.8 1.8v10.6z"/>',
  Professor:'<path d="M12 6.3C9.8 4.9 6.9 4.4 4 5.4v13.1c2.9-1 5.8-.5 8 .9 2.2-1.4 5.1-1.9 8-.9V5.4c-2.9-1-5.8-.5-8 .9z"/>',
  Asura:'<rect x="5" y="9" width="14" height="11" rx="3"/><circle cx="8" cy="8.5" r="2"/><circle cx="12" cy="7.8" r="2.1"/><circle cx="16" cy="8.5" r="2"/><path d="M3.5 12a2.3 2.3 0 012.3-2.3h1.4v7.6H5.8A2.3 2.3 0 013.5 15V12z"/>'
};
const JOB_COLORS = { 'High Priest':'#ffd24d','High Wizard':'#a374ff',Paladin:'#4db8ff','Lord Knight':'#ff4444',Mastersmith:'#ff9838',Summoner:'#4dffa6',Sniper:'#a8e63d','Assasin Cross':'#e8305f',Stalker:'#c34dff',Biochemist:'#3dffc4',Rebellion:'#ff6b3d',Gypsy:'#ff5eb0',Minstrel:'#3ddbe6',Professor:'#5c7fff',Asura:'#ffb83d' };
function jobIconSvg(job){
  const inner = JOB_ICONS[job];
  if(!inner) return '';
  return `<svg class="job-icon" style="color:${JOB_COLORS[job]||'#7c8998'}" viewBox="0 0 24 24" fill="currentColor" stroke="none">${inner}</svg>`;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let currentLineup = null;

function collectLineupNames(lineup){
  const names = new Set();
  lineup.teams.forEach(t=>t.parties.forEach(p=>p.slots.forEach(s=>{ if(s.name) names.add(s.name); })));
  return [...names].sort();
}

async function loadAbsences(lineupId){
  const { data } = await sb.from('absences').select('*').eq('lineup_id', lineupId).order('member_name');
  return data || [];
}

let guildRoster = [];
let guildSessions = [];
let statsGuildId = null;

async function loadStatsData(guildId){
  statsGuildId = guildId;
  const [{ data: members }, { data: sess }] = await Promise.all([
    sb.from('roster_members').select('id,mmid,name,job,party_role').eq('guild_id', guildId).order('name'),
    sb.from('sessions').select('*, session_entries(*)').eq('guild_id', guildId)
  ]);
  guildRoster = members || [];
  guildSessions = (sess || []).map(s => ({ ...s, entries: s.session_entries || [] }));
}

function computePersonalStats(name){
  // Attendance is based on unique WAR DAYS, not raw saved records — if an
  // officer uploads Elite and Sub scoreboards separately for the same
  // date, that's one war day, not two chances to "attend."
  const totalDays = new Set(guildSessions.map(s=>s.date).filter(Boolean)).size;
  const attendedDates = new Set();
  let tablets=0, monsters=0, kills=0, assists=0, deaths=0, scoreSum=0, best=0, mvps=0;
  guildSessions.forEach(s=>{
    const entry = (s.entries||[]).find(e=>e.name===name);
    if(entry){
      if(s.date) attendedDates.add(s.date);
      tablets+=entry.tablets; monsters+=entry.monsters; kills+=entry.kills; assists+=entry.assists; deaths+=entry.deaths;
      scoreSum+=entry.score; if(entry.score>best) best=entry.score;
      if(entry.rank && String(entry.rank).toUpperCase()==='MVP') mvps++;
    }
  });
  const attended = attendedDates.size;
  return {
    totalSessions: totalDays, attended,
    attendance: totalDays ? (attended/totalDays*100) : 0,
    avgScore: attended ? (scoreSum/attended) : 0,
    best, tablets, monsters, kills, assists, deaths, mvps
  };
}

// Guild-wide all-time leaderboards for the top of the share page — mirrors
// the Elite/Sub tablets-vs-monsters distinction from the officer dashboard:
// Elite's scoreboard shows Tablets Captured/Monsters, Sub's shows Monster/
// Boss (entered into the same "tablets" field), so a true tablets total
// only comes from Elite, and monster kills combines Elite's Monsters with
// Sub's (mislabeled) Tablets column.
function computeGuildTopStats(){
  const map = {};
  const ensure = name => { if(!map[name]) map[name] = { name, kills:0, assists:0, trueTablets:0, trueMonsterKills:0, scoreSum:0, attendedDates:new Set(), job:'' }; return map[name]; };
  guildSessions.forEach(s=>{
    (s.entries||[]).forEach(e=>{
      const m = ensure(e.name);
      m.kills += e.kills; m.assists += e.assists;
      if(s.role==='Elite'){ m.trueTablets += e.tablets; m.trueMonsterKills += e.monsters; }
      else if(s.role==='Sub'){ m.trueMonsterKills += e.tablets; }
      m.scoreSum += e.score;
      if(s.date) m.attendedDates.add(s.date);
    });
  });
  Object.values(map).forEach(m=>{
    const rm = guildRoster.find(r=>r.name===m.name);
    m.job = rm ? rm.job : '';
    m.avgScore = m.attendedDates.size ? Math.round(m.scoreSum/m.attendedDates.size) : 0;
  });
  return Object.values(map);
}
function renderTopScorersPanel(){
  const all = computeGuildTopStats();
  if(all.length===0) return '';
  const top = (key, filterPositive) => [...all].filter(m=>!filterPositive || m[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,5);
  const lbRows = (list, key) => list.length
    ? list.map((m,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span>${jobIconSvg(m.job)}<span class="lb-name">${escapeHtml(m.name)}</span><span class="lb-value">${m[key]}</span></div>`).join('')
    : '<div class="empty-state" style="padding:14px 4px;">No data yet.</div>';
  return `
    <div class="hud-panel">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <h3 class="section-title" style="font-size:16px;">All-Time Top Scorers</h3>
      <p class="section-hint">Guild-wide totals across every recorded war.</p>
      <div class="dash-grid">
        <div class="dash-panel"><h3>Top Kills</h3>${lbRows(top('kills', true), 'kills')}</div>
        <div class="dash-panel"><h3>Top Assists</h3>${lbRows(top('assists', true), 'assists')}</div>
        <div class="dash-panel"><h3>Top Tablets Taken</h3>${lbRows(top('trueTablets', true), 'trueTablets')}</div>
        <div class="dash-panel"><h3>Top Monster Kills</h3>${lbRows(top('trueMonsterKills', true), 'trueMonsterKills')}</div>

// Groups saved records into unique war days — if Elite and Sub were
// uploaded separately for the same date, that's one war, not two, matching
// how attendance is already counted above.
function getWarDays(){
  const byDate = {};
  guildSessions.forEach(s=>{
    const d = s.date || '';
    if(!byDate[d]) byDate[d] = { date: d, opposing_guild: '', entries: [] };
    if(!byDate[d].opposing_guild && s.opposing_guild) byDate[d].opposing_guild = s.opposing_guild;
    byDate[d].entries = byDate[d].entries.concat(s.entries||[]);
  });
  return Object.values(byDate).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function computeSpecificWarStats(name, date){
  const day = getWarDays().find(d=>d.date===date);
  if(!day) return null;
  const entry = day.entries.find(e=>e.name===name);
  return {
    date: day.date, opposing_guild: day.opposing_guild, attended: !!entry,
    rank: entry ? entry.rank : null,
    mvp: !!(entry && String(entry.rank||'').toUpperCase()==='MVP'),
    score: entry ? entry.score : 0, kills: entry ? entry.kills : 0, assists: entry ? entry.assists : 0,
    deaths: entry ? entry.deaths : 0, tablets: entry ? entry.tablets : 0, monsters: entry ? entry.monsters : 0,
  };
}

async function exportShareCard(kind){
  if(!lastCardData || typeof html2canvas === 'undefined') return;
  let holder = document.getElementById('share-card-offscreen');
  if(!holder){
    holder = document.createElement('div');
    holder.id = 'share-card-offscreen';
    holder.style.position = 'fixed';
    holder.style.left = '-9999px';
    holder.style.top = '0';
    document.body.appendChild(holder);
  }
  holder.innerHTML = buildShareCardHTML();
  const cardEl = holder.firstElementChild;
  const canvas = await html2canvas(cardEl, { scale:2, backgroundColor:'#13151a' });
  const filename = `war-log-${lastCardData.name.replace(/[^a-z0-9]/gi,'_')}-${kind==='specific'&&lastCardData.war?lastCardData.war.date:'alltime'}`;
  if(kind === 'image'){
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `${filename}.png`;
    a.click();
  } else if(kind === 'pdf'){
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:'portrait', unit:'px', format:[canvas.width, canvas.height] });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save(`${filename}.pdf`);
  }
  holder.innerHTML = '';
}

function wireNameUpdatePanel(){
  const btn = document.getElementById('rename-submit-btn');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const statusEl = document.getElementById('rename-status');
    const currentName = document.getElementById('rename-name').value;
    const uid = document.getElementById('rename-mmid').value.trim();
    const newName = document.getElementById('rename-new-name').value.trim();
    const newJob = document.getElementById('rename-new-job').value;

    if(!currentName){
      statusEl.className = 'status-line error';
      statusEl.textContent = 'Select your current name first.';
      return;
    }
    if(!uid){
      statusEl.className = 'status-line error';
      statusEl.textContent = 'Enter your UID to verify it\'s you.';
      return;
    }
    if(!newName){
      statusEl.className = 'status-line error';
      statusEl.textContent = 'Enter your new name.';
      return;
    }
    const member = guildRoster.find(m=>m.name===currentName);
    if(!member || String(member.mmid||'').trim().toLowerCase() !== uid.toLowerCase()){
      statusEl.className = 'status-line error';
      statusEl.textContent = "Name and UID don't match our records.";
      return;
    }

    const updates = {};
    if(newName !== member.name){
      const taken = guildRoster.some(m => m.id !== member.id && m.name === newName);
      if(taken){
        statusEl.className = 'status-line error';
        statusEl.textContent = 'That name is already taken by someone else on the roster — double check the spelling.';
        return;
      }
      updates.name = newName;
    }
    if(newJob) updates.job = newJob;

    if(Object.keys(updates).length === 0){
      statusEl.className = 'status-line';
      statusEl.textContent = 'No changes to save.';
      return;
    }

    btn.disabled = true;
    statusEl.className = 'status-line';
    statusEl.textContent = 'Saving…';

    const { error } = await sb.from('roster_members').update(updates).eq('id', member.id);
    if(error){
      btn.disabled = false;
      statusEl.className = 'status-line error';
      statusEl.textContent = error.code === '23505'
        ? 'That name is already taken by someone else on the roster.'
        : "Couldn't save — try again in a moment.";
      return;
    }

    // Historical war records store each player's name as text (not a
    // live link to the roster), so a rename won't retroactively show
    // up in past sessions unless we update those rows too — this keeps
    // your attendance/stat history matched to your new name.
    if(updates.name){
      const { data: sessRows } = await sb.from('sessions').select('id').eq('guild_id', statsGuildId);
      const sessionIds = (sessRows||[]).map(s=>s.id);
      if(sessionIds.length){
        await sb.from('session_entries').update({ name: updates.name }).eq('name', member.name).in('session_id', sessionIds);
      }
    }

    // Saved party lineups also store each slot's {name, job} as a
    // snapshot rather than a live link to the roster — so any lineup
    // (including ones already shared with the guild) that already has
    // this person placed needs its slots patched too, or it'll keep
    // showing their old name/job.
    {
      const oldName = member.name;
      const finalName = updates.name || oldName;
      const finalJob = updates.job || member.job || '';
      const { data: allLineups } = await sb.from('party_lineups').select('id,teams').eq('guild_id', statsGuildId);
      for(const l of (allLineups || [])){
        let changed = false;
        const teams = (l.teams || []).map(team => ({
          ...team,
          parties: team.parties.map(party => ({
            ...party,
            slots: party.slots.map(slot => {
              if(slot.name === oldName){
                changed = true;
                return { ...slot, name: finalName, job: finalJob };
              }
              return slot;
            })
          }))
        }));
        if(changed){
          await sb.from('party_lineups').update({ teams }).eq('id', l.id);
        }
      }
    }

    // Keep officers informed: a durable log entry, plus a Discord ping.
    // The Discord post stays fire-and-forget (a plain fetch, safe to not
    // await), but the Supabase insert below is properly awaited — a
    // bare, un-awaited call on the query builder never actually sends
    // its request, since supabase-js only dispatches once something
    // consumes the returned thenable.
    await sb.from('profile_changes').insert({
      guild_id: statsGuildId,
      old_name: member.name,
      new_name: updates.name || null,
      old_job: member.job || null,
      new_job: updates.job || null,
    });
    fetch('/api/post-profile-change', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        oldName: member.name,
        newName: updates.name || null,
        oldJob: member.job || null,
        newJob: updates.job || null,
      })
    }).catch(()=>{});

    await loadStatsData(statsGuildId);
    const section = document.getElementById('stats-section');
    if(section){
      section.innerHTML = `${renderTopScorersPanel()}${renderStatsLookupPanel()}${renderNameUpdatePanel()}`;
      wireStatsLookup();
      wireNameUpdatePanel();
    }
    // If this rename touched the lineup currently open on this page,
    // refresh it in place so the visitor sees their new name immediately.
    if(currentLineup && collectLineupNames(currentLineup).includes(member.name)){
      await render();
    }
    // Set the success message LAST, after any render() above, since
    // render() rebuilds the whole page (including a fresh #rename-status
    // element) and would otherwise wipe out this confirmation.
    const freshStatus = document.getElementById('rename-status');
    if(freshStatus){ freshStatus.className = 'status-line ok'; freshStatus.textContent = 'Updated! The roster and any saved lineups now reflect your changes.'; }
  });
}

      <h2 class="event-title">${escapeHtml(lineup.name)}</h2>
      <div class="meta-bar">
        ${lineup.date && !(lineup.name && lineup.name.includes(lineup.date)) ? `<div class="meta-item"><div class="meta-label">Date</div><div class="meta-value plain">${escapeHtml(lineup.date)}</div></div>` : ''}
        ${lineup.map_name ? `<div class="meta-item"><div class="meta-label">${lineup.event_type==='Guild Overrun'?'Guild Category':'Map'}</div><div class="meta-value">${escapeHtml(lineup.map_name)}</div></div>` : ''}
        ${lineup.opposing_guild && !(lineup.name && lineup.name.includes(lineup.opposing_guild)) ? `<div class="meta-item"><div class="meta-label">Opponent</div><div class="meta-value">${escapeHtml(lineup.opposing_guild)}</div></div>` : ''}
      </div>
      ${lineup.event_type==='Guild Overrun' && (lineup.opponents||[]).some(o=>o&&o.name) ? `
      <div style="margin:-8px 0 20px;">
        <div class="meta-label" style="margin-bottom:8px;">Opponents</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${(lineup.opponents||[]).filter(o=>o&&o.name).map(o=>`<span class="chip">${escapeHtml(o.name)}${o.server?' <span style="color:var(--ink-faint);">('+escapeHtml(o.server)+')</span>':''}</span>`).join('')}
        </div>
      </div>` : ''}
      ${lineup.notes ? `<div style="margin:-8px 0 20px; font-size:13.5px; color:var(--ink-soft);"><div class="meta-label" style="margin-bottom:6px;">Notes</div>${escapeHtml(lineup.notes)}</div>` : ''}
      ${lineup.share_expires_at ? `<div style="font-size:11.5px; color:var(--ink-faint); margin:-14px 0 20px;">This link expires ${new Date(lineup.share_expires_at).toLocaleString()}</div>` : ''}
      ${lineup.teams.map(team => `
        <div class="team-block">
          <div class="team-header"><span class="team-name-input" style="border-bottom:none;">${escapeHtml(team.name)}</span></div>
          <div class="party-grid">
            ${team.parties.map(party => `
              <div class="party-card">
                <div class="party-card-head"><span>${escapeHtml(party.name)}</span></div>
                ${party.slots.map(slot => {
                  const liveJob = slot.name ? ((guildRoster.find(m=>m.name===slot.name)||{}).job || slot.job || '') : '';
                  const liveRole = slot.name ? ((guildRoster.find(m=>m.name===slot.name)||{}).party_role || '') : '';
                  const nameJobHtml = slot.name
                    ? escapeHtml(slot.name) + (liveJob ? ' — '+escapeHtml(liveJob) : '')
                    : '\u2014 empty \u2014';
                  return `
                  <div class="slot-btn readonly">
                    <span class="slot-btn-label">${jobIconSvg(liveJob)}<span class="slot-label-text">${nameJobHtml}</span></span>
                    ${liveRole ? `<span class="slot-role-text">(${escapeHtml(liveRole)})</span>` : ''}
                  </div>
                `;}).join('')}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <div class="hud-panel absence-panel">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <h3 class="section-title" style="font-size:16px;">Can't Make It?</h3>
      <p class="section-hint">Pick your name and let your officers know if you'll be absent.</p>
      <div class="field-row">
        <div>
          <label for="absence-name">Your Name</label>
          <select id="absence-name">
            <option value="">— Select your name —</option>
            ${names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label for="absence-date">Date</label>
          <input type="date" id="absence-date" value="${lineup.date||''}">
        </div>
        <div style="flex:0 0 auto; display:flex; align-items:flex-end;">
          <button class="btn gold small" id="absence-submit-btn">Mark Absent</button>
        </div>
      </div>
      <div class="status-line" id="absence-status"></div>
      <div id="absence-list"></div>
    </div>

    <footer style="text-align:center; font-size:12px; color:var(--ink-faint); margin-top:24px;">
      View-only lineup — ask an officer if something needs to change.
    </footer>
  `;

  document.getElementById('absence-submit-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('absence-name').value;
    const date = document.getElementById('absence-date').value;
    const statusEl = document.getElementById('absence-status');
    if(!name || !date){ statusEl.className='status-line error'; statusEl.textContent='Pick your name and a date.'; return; }
    statusEl.className='status-line'; statusEl.textContent='Saving…';

    let resultMsg, resultCls;
    const { data: existingRows } = await sb.from('absences').select('id').eq('lineup_id', currentLineup.id).eq('member_name', name).eq('absent_date', date);
    if(existingRows && existingRows.length){
      resultMsg = "You're already marked absent for that date.";
      resultCls = 'ok';
    } else {
      const { error } = await sb.from('absences').insert({ guild_id: currentLineup.guild_id, lineup_id: currentLineup.id, member_name: name, absent_date: date });
      if(error){
        resultMsg = "Couldn't save — try again.";
        resultCls = 'error';
      } else {
        // Only pull them out of THIS lineup's parties if the absence is for
        // THIS lineup's date — an advance absence for a future war day
        // should just be logged, not rip them out of an unrelated lineup
        // that happens to be open right now.
        if(date === (currentLineup.date || '')){
          // Re-fetch the latest teams right before modifying — if someone else
          // marked themselves absent moments ago, we must build on THEIR
          // change, not the possibly-stale copy loaded when this page opened.
          // (Without this, whoever saves last can accidentally undo an
          // earlier person's removal.)
          const { data: latestLineup } = await sb.from('party_lineups').select('teams').eq('id', currentLineup.id).single();
          const teams = latestLineup ? latestLineup.teams : JSON.parse(JSON.stringify(currentLineup.teams));
          let changed = false;
          teams.forEach(t=>t.parties.forEach(p=>p.slots.forEach(s=>{
            if(s.name === name){ s.name=''; s.job=''; changed=true; }
          })));
          if(changed){
            await sb.from('party_lineups').update({ teams }).eq('id', currentLineup.id);
          }
          resultMsg = changed ? "Got it — you're marked absent and removed from your party." : 'Got it — marked as absent.';
        } else {
          resultMsg = "Got it — you're marked absent for that date. Since it's not this lineup's date, your current spot here is untouched.";
        }
        resultCls = 'ok';
        // Fire-and-forget: notify Discord automatically. Never blocks the
        // guildmate's confirmation, and never surfaces an error to them —
        // the absence is already safely saved either way.
        fetch('/api/post-absence', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ memberName: name, date, lineupName: currentLineup.name })
        }).catch(()=>{});
      }
    }
    await render();
    const freshStatusEl = document.getElementById('absence-status');
    if(freshStatusEl){ freshStatusEl.className = 'status-line '+resultCls; freshStatusEl.textContent = resultMsg; }
  });

  wireStatsLookup();
  wireNameUpdatePanel();
  await renderAbsenceList(lineup.id);
}
render();
</script>
</body>
</html>
